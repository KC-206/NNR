<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avie String Builder</title>
    <meta
      name="description"
      content="Generate polished avatar strings for HTML and BBCode with live preview and one-click copy."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">Avatar Formatting Tool</p>
          <div class="hero-copy__row">
            <h1>Build avie strings</h1>
            <p class="hero-text">
              Paste your avatar image URL and display name, choose upstairs or
              downstairs, then copy the finished string.
            </p>
          </div>
        </div>
        <div class="hero-card">
          <div class="hero-card__glow"></div>
          <p class="hero-card__label">Quick Example</p>
          <code id="hero-example"></code>
        </div>
      </header>

      <main class="workspace">
        <section class="panel controls-panel">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">Generator</p>
              <h2>Compose your string</h2>
            </div>
            <div class="mode-switch" role="tablist" aria-label="Format mode">
              <button class="mode-button active" data-mode="html" role="tab" aria-selected="true">
                HTML (Downstairs)
              </button>
              <button class="mode-button" data-mode="bbcode" role="tab" aria-selected="false">
                BBCode (Upstairs)
              </button>
            </div>
          </div>

          <form id="builder-form" class="builder-form" novalidate>
            <label class="field field--priority">
              <span>Avatar Image URL</span>
              <input
                id="avatar-url"
                name="avatarUrl"
                type="url"
                placeholder="https://example.com/avatar.jpg"
                required
              />
            </label>

            <label class="field field--priority">
              <span>Display Name</span>
              <input
                id="display-name"
                name="displayName"
                type="text"
                placeholder="Sabrina"
                maxlength="120"
                required
              />
            </label>

            <div class="field-grid">
              <label class="field">
                <span>Height</span>
                <input
                  id="avatar-height"
                  name="avatarHeight"
                  type="number"
                  min="1"
                  max="2000"
                  value="325"
                  required
                />
              </label>

              <label class="field">
                <span>Alignment</span>
                <select id="avatar-align" name="avatarAlign">
                  <option value="left">Left</option>
                  <option value="right">Right</option>
                  <option value="center">Center</option>
                </select>
              </label>
            </div>

            <label class="field checkbox-field">
              <input id="append-name" name="appendName" type="checkbox" checked />
              <span>Append the display name after the image code</span>
            </label>

            <div class="actions">
              <button type="submit" class="primary-button">Generate String</button>
              <button type="button" id="reset-button" class="secondary-button">Reset</button>
            </div>
          </form>
        </section>

        <section class="panel output-panel">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">Output</p>
              <h2>Ready to copy</h2>
            </div>
            <button id="copy-button" class="secondary-button" type="button">
              Copy Output
            </button>
          </div>

          <label class="field">
            <span>Generated String</span>
            <textarea
              id="output"
              rows="7"
              readonly
              aria-label="Generated output"
            ></textarea>
          </label>

          <p id="status-message" class="status-message" aria-live="polite"></p>

          <div class="preview-card">
            <div class="preview-card__header">
              <p class="section-kicker">Live Preview</p>
              <span id="preview-mode-label">HTML (Downstairs) Preview</span>
            </div>
            <div id="preview" class="preview-surface"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
